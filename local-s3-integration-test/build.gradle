plugins {
    id 'local-s3.java-conventions'
}

dependencies {

    // Main source dependencies for RealS3 annotation and extensions
    implementation(libs.junit5)
    implementation(libs.awssdkS3)
    implementation(libs.awssdkS3vectors)
    implementation(libs.slf4jApi)

    testImplementation(project(":local-s3-jupiter"))
    testImplementation (project(":local-s3-datatypes"))
    testImplementation(project(":local-s3-core"))
    testImplementation(project(":local-s3-rest"))

    testImplementation(libs.awssdkS3)
    testImplementation(libs.awssdkS3vectors)
    testImplementation(libs.awssdkS3tables)
    testImplementation(libs.awss3ApacheClient)
    testImplementation(libs.mockitoCore)
    testImplementation(libs.duckdb)
    testImplementation(libs.icebergCore)
    testImplementation(libs.icebergAws)
    testImplementation(libs.icebergData)
    testImplementation(libs.icebergParquet)
    // The test jars of Iceberg, for IcebergRestCatalogComplianceTest: CatalogTests lives in the one of iceberg-core and
    // the TestHelpers it uses in the one of iceberg-api, and both of them assert with AssertJ.
    testImplementation(variantOf(libs.icebergCore) { classifier('tests') })
    testImplementation(variantOf(libs.icebergApi) { classifier('tests') })
    testImplementation(libs.assertjCore)
    testImplementation(libs.parquetColumn)
    testRuntimeOnly(libs.icebergOrc)
    testImplementation(libs.deltaKernelApi)
    testImplementation(libs.deltaKernelDefaults)
    testImplementation(libs.awssdkKms)
    testImplementation(libs.awssdkSts)
    // The Amazon S3 Encryption Client, for S3EncryptionClientIntegrationTest. Taken with its dependencies as they are:
    // it encodes the metadata of an object with the MIME utilities of saaj-impl, so that one isn't excludable.
    testImplementation(libs.awsS3EncryptionClient)
    // On the compile classpath, not just at runtime: DefaultEngine.create() is overloaded on Hadoop's Configuration,
    // so javac needs the class to resolve the FileIO overload that the Delta tests use.
    testImplementation(libs.hadoopClientApi)
    testRuntimeOnly(libs.hadoopClientRuntime)
    testRuntimeOnly(libs.logbackClassic)
}

// The tests fall into three groups, by JUnit tag:
// - untagged: LocalS3 with the AWS SDK, which `test` runs, and the pull request builds with it;
// - `data-tools`: DuckDB, Apache Iceberg and Delta Lake, whose dependencies and native code make them the slow ones, which
//   `dataToolsTest` runs, in a job of their own in CI;
// - `real-s3`: the tests of `@RealS3`, which need AWS credentials, which only `realS3Test` runs.
tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'data-tools', 'real-s3'
    }
}

def requireDuckDbTests = providers.gradleProperty('requireDuckDbTests')
    .map { it.toBoolean() }
    .orElse(false)
def requiredDuckDbTestClasses = [
    'com.robothy.s3.test.DuckDbParquetIntegrationTest',
    'com.robothy.s3.test.DuckLakeIntegrationTest'
] as Set

def dataToolsTest = tasks.register('dataToolsTest', Test) {
    description = 'Runs the end-to-end tests with DuckDB, Apache Iceberg and Delta Lake.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'data-tools'
    }

    def successfulDuckDbTestClasses = [] as Set
    afterTest { descriptor, result ->
        if (result.resultType == TestResult.ResultType.SUCCESS
            && requiredDuckDbTestClasses.contains(descriptor.className)) {
            successfulDuckDbTestClasses.add(descriptor.className)
        }
    }
    outputs.upToDateWhen { !requireDuckDbTests.get() }
    outputs.cacheIf { !requireDuckDbTests.get() }
    doLast {
        if (requireDuckDbTests.get()) {
            def missing = requiredDuckDbTestClasses - successfulDuckDbTestClasses
            if (!missing.isEmpty()) {
                throw new GradleException('Required DuckDB test classes ran no successful tests: ' + missing.join(', '))
            }
        }
    }
    shouldRunAfter tasks.named('test')
}

// CI runs this before dataToolsTest so that extension download failures cannot turn the DuckDB tests into skips.
tasks.register('installDuckDbExtensions', JavaExec) {
    description = 'Installs the pinned DuckDB extensions and prints the engine, driver and extension versions.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.robothy.s3.test.DuckDbExtensionInstaller'
    args 'httpfs', 'ducklake'
}

tasks.named('check') {
    dependsOn dataToolsTest
}

tasks.register('realS3Test', Test) {
    description = 'Runs the tests of @RealS3 against Amazon S3, with the credentials of AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'real-s3'
    }
}
