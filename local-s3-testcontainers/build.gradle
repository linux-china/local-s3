plugins {
    id 'java-library'
    id 'local-s3.java-conventions'
    id 'local-s3.publish'
}


dependencies {
    // Types of the public API: LocalS3Container extends GenericContainer, so every inherited method a user
    // calls, e.g. start() or getMappedPort(), is declared there, and DEFAULT_IMAGE_NAME is a DockerImageName.
    api(libs.testContainers)

    implementation(libs.apacheCommonsCompress)
}

test {
    useJUnitPlatform()
}
