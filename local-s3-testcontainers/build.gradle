plugins {
    id 'java-library'
    id 'local-s3.java-conventions'
    id 'local-s3.publish'
}


dependencies {
    // Types of the public API: LocalS3Container extends GenericContainer, so every inherited method a user
    // calls, e.g. start() or getMappedPort(), is declared there, and DEFAULT_IMAGE_NAME is a DockerImageName.
    api(libs.testContainers)

    implementation(libs.apacheCommonsCompress)

    // Optional: @ServiceConnection of a LocalS3Container, which the application brings with spring-boot-testcontainers
    // and Spring Cloud AWS. LocalS3AwsConnectionDetailsFactory is registered in META-INF/spring.factories, and Spring
    // Boot skips it where either is missing.
    compileOnly(libs.springBootTestcontainers)
    // Optional: the service connection of a LocalS3 service of Docker Compose, which the application brings with
    // spring-boot-docker-compose; LocalS3DockerComposeConnectionDetailsFactory is registered next to the one above.
    compileOnly(libs.springBootDockerCompose)
    compileOnly(libs.springCloudAwsAutoconfigure) { transitive = false }

    testImplementation(platform(libs.springBootBom))
    testImplementation(libs.springBootTestcontainers)
    testImplementation(libs.springBootDockerCompose)
    testImplementation(libs.springCloudAwsAutoconfigure)
}

test {
    useJUnitPlatform()
}
