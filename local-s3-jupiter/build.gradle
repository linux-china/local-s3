plugins {
    id 'java-library'
    id 'local-s3.java-conventions'
    id 'local-s3.publish'
}

dependencies {
    // Types of the public API: LocalS3Mode in @LocalS3, and the injected S3Client and S3VectorsClient.
    api project(":local-s3-rest")
    api(libs.awssdkS3)
    api(libs.awssdkS3vectors)

    // The Netty modules of the netty-nio-client of the AWS SDK at LocalS3's version, nearer to a Maven consumer than
    // the ones of the AWS SDK; see the nettyOfAwsSdk bundle in gradle/libs.versions.toml.
    runtimeOnly(platform(libs.nettyBom))
    runtimeOnly(libs.bundles.nettyOfAwsSdk)

    // Test projects bring their own JUnit; don't impose a JUnit version or engine on them.
    compileOnly(libs.junit5JupiterApi)

    // Runs fixture test classes, e.g. with @Nested classes or in parallel, to check how services are shut down.
    testImplementation(libs.junitPlatformLauncher)
    // A logging backend for the tests of this module only; users choose their own.
    testRuntimeOnly(libs.logbackClassic)
}
