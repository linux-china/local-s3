<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LocalS3 console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128230;</text></svg>">
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #fbfbfc;
    --border: #e3e6ea;
    --text: #1b1f24;
    --muted: #6b7581;
    --accent: #2f6feb;
    --accent-soft: #e8f0fe;
    --danger: #b3261e;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .06);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --panel: #1b1f26;
      --panel-2: #20252d;
      --border: #2c333d;
      --text: #e6e9ee;
      --muted: #97a1ae;
      --accent: #6ea0ff;
      --accent-soft: #1e2a42;
      --danger: #ff8a80;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  /* The display of a button or a toolbar would otherwise show what the page hides. */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC",
        "Microsoft YaHei", sans-serif;
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header .brand { font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  header .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #34a853; }
  header .endpoint {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 40vw;
  }
  header .spacer { flex: 1; }
  button, .btn {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 10px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  button:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .layout { display: grid; grid-template-columns: 260px 1fr; min-height: 0; }
  aside {
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: grid;
    grid-template-rows: auto 1fr;
    min-height: 0;
  }
  aside .head { padding: 12px 12px 8px; display: grid; gap: 8px; }
  aside h2 {
    margin: 0;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
  input[type=search], input[type=text] {
    font: inherit;
    width: 100%;
    padding: 6px 9px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    color: var(--text);
  }
  input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .buckets { overflow: auto; padding: 0 8px 12px; }
  .bucket {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: none;
    padding: 7px 9px;
    border-radius: 7px;
    cursor: pointer;
    color: inherit;
  }
  .bucket:hover { background: var(--panel-2); color: inherit; }
  .bucket.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .bucket small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
  .bucket.active small { color: var(--accent); opacity: .8; }
  main { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; position: relative; }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  .crumbs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-family: var(--mono); font-size: 13px; }
  .crumbs button { border: 0; background: none; padding: 2px 4px; border-radius: 5px; }
  .crumbs button:hover { background: var(--accent-soft); }
  .crumbs span { color: var(--muted); }
  .toolbar .filter { width: 220px; }
  .toolbar select {
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 6px;
  }
  .content { overflow: auto; padding: 0 0 40px; min-height: 0; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky;
    top: 0;
    background: var(--bg);
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    font-weight: 600;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    z-index: 1;
  }
  tbody td { padding: 7px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:hover { background: var(--panel); }
  td.name { width: 100%; }
  td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
  td.date { white-space: nowrap; color: var(--muted); }
  td.actions { white-space: nowrap; text-align: right; }
  .entry {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 0;
    background: none;
    padding: 0;
    color: inherit;
    cursor: pointer;
    font: inherit;
    max-width: 100%;
    text-align: left;
  }
  .entry:hover { color: var(--accent); }
  .entry .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon { width: 16px; height: 16px; flex: none; color: var(--muted); }
  .entry:hover .icon { color: var(--accent); }
  .actions button { padding: 3px 7px; font-size: 12px; margin-left: 4px; }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  .dropzone {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: none;
    place-items: center;
    background: color-mix(in srgb, var(--accent-soft) 88%, transparent);
    border: 2px dashed var(--accent);
    border-radius: 10px;
    margin: 8px;
    color: var(--accent);
    font-weight: 600;
    text-align: center;
    pointer-events: none;
  }
  .dropzone.on { display: grid; }
  .dropzone small { display: block; font-weight: 400; color: var(--muted); margin-top: 6px; }
  .uploads {
    position: fixed;
    right: 18px;
    bottom: 18px;
    width: min(380px, calc(100vw - 36px));
    max-height: 46vh;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
    z-index: 10;
  }
  .uploads[hidden] { display: none; }
  .uploads .head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
    font-size: 13px;
    font-weight: 600;
  }
  .uploads .head button { padding: 2px 8px; font-size: 12px; }
  .uploads .list { overflow: auto; padding: 6px 12px 10px; }
  .upload { padding: 6px 0; font-size: 12.5px; }
  .upload .line { display: flex; gap: 8px; align-items: baseline; }
  .upload .key { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); flex: 1; }
  .upload .status { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .upload.failed .status { color: var(--danger); }
  .upload .bar { height: 3px; border-radius: 3px; background: var(--border); margin-top: 5px; overflow: hidden; }
  .upload .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  .upload.done .bar i { background: #34a853; }
  .upload.failed .bar i { background: var(--danger); }
  dialog#new-bucket, dialog#confirm {
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    color: var(--text);
    box-shadow: var(--shadow);
    width: min(440px, 92vw);
  }
  dialog#new-bucket .ask, dialog#confirm .ask { padding: 18px; display: grid; gap: 10px; }
  dialog#new-bucket h3, dialog#confirm h3 { margin: 0; font-size: 15px; }
  dialog#confirm .target { font-family: var(--mono); font-size: 12.5px; color: var(--muted); word-break: break-all; }
  dialog#new-bucket .row, dialog#confirm .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  dialog#new-bucket input { font-family: var(--mono); }
  dialog#new-bucket .hint { font-size: 12px; color: var(--muted); }
  dialog#new-bucket .hint.error { color: var(--danger); }
  aside h2 button {
    border: 0;
    background: none;
    padding: 0 2px;
    font: inherit;
    font-size: 11px;
    letter-spacing: .08em;
    color: var(--accent);
    cursor: pointer;
  }
  .state { padding: 40px 16px; text-align: center; color: var(--muted); }
  .state.error { color: var(--danger); }
  .more { padding: 16px; text-align: center; }
  dialog#preview {
    width: min(1100px, 92vw);
    height: min(800px, 88vh);
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    color: var(--text);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  dialog::backdrop { background: rgba(10, 12, 16, .5); }
  dialog#preview .frame { display: grid; grid-template-rows: auto auto 1fr; height: 100%; }
  dialog#preview .bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }
  dialog#preview .bar .title { font-family: var(--mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
  dialog#preview .bar .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  dialog#preview .body { overflow: auto; background: var(--bg); display: grid; }
  dialog#preview .body > img { max-width: 100%; max-height: 100%; margin: auto; display: block; }
  dialog#preview .body > .pane { background: var(--bg); }
  dialog#preview .body > iframe, dialog#preview .body > video { width: 100%; height: 100%; border: 0; background: #000; }
  dialog#preview .body > audio { margin: auto; }
  dialog#preview pre {
    margin: 0;
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 12.5px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  dialog#connect {
    width: min(760px, 94vw);
    max-height: 88vh;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    color: var(--text);
    box-shadow: var(--shadow);
  }
  dialog#connect .frame { display: grid; grid-template-rows: auto auto 1fr auto; max-height: 86vh; }
  dialog#connect .bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }
  dialog#connect .bar .title { font-weight: 600; }
  dialog#connect .bar .meta { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  dialog#connect .tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 0; }
  dialog#connect .tabs button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  dialog#connect .query {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 10px 14px 0;
    padding: 6px 8px 6px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
  }
  dialog#connect .query[hidden] { display: none; }
  dialog#connect .query code {
    flex: 1;
    font-family: var(--mono);
    font-size: 12.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  dialog#connect pre {
    margin: 10px 14px;
    padding: 12px 14px;
    overflow: auto;
    font-family: var(--mono);
    font-size: 12.5px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    white-space: pre;
  }
  dialog#connect .row { display: flex; justify-content: flex-end; gap: 8px; padding: 0 14px 14px; }
  .toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s;
  }
  .toast.on { opacity: .92; }
  .modes { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; padding: 2px; gap: 2px; }
  .modes button { border: 0; background: none; padding: 3px 10px; border-radius: 6px; font-size: 13px; }
  .modes button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .modes button[hidden] { display: none; }
  .tools { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }
  .tools[hidden] { display: none; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  dialog#preview .tabs { padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .badge {
    display: inline-block;
    font-size: 11px;
    line-height: 1.4;
    padding: 0 6px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
    white-space: nowrap;
    margin-left: 6px;
    font-family: system-ui, sans-serif;
  }
  .badge.accent { border-color: var(--accent); color: var(--accent); }
  .badge.warn { border-color: var(--danger); color: var(--danger); }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .pane { padding: 14px 16px; display: grid; gap: 18px; align-content: start; }
  .pane h3 {
    margin: 0 0 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pane h3 button { font-size: 12px; text-transform: none; letter-spacing: 0; padding: 2px 8px; }
  .pane table { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
  .pane thead th { background: var(--panel-2); }
  .pane tbody tr:last-child td { border-bottom: 0; }
  table.kv td { padding: 5px 12px; }
  table.kv td:first-child { color: var(--muted); white-space: nowrap; width: 1%; }
  table.kv td:last-child { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; background: var(--panel); min-width: 0; }
  .card small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .card div { font-family: var(--mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane pre, dialog#detail pre {
    margin: 0;
    padding: 12px 14px;
    font-family: var(--mono);
    font-size: 12.5px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .indent { display: inline-block; }
  tr.expanded td { background: var(--panel-2); }
  td.wrap { white-space: normal; word-break: break-all; }
  .clip { max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  dialog#detail {
    width: min(820px, 94vw);
    max-height: 88vh;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    color: var(--text);
    box-shadow: var(--shadow);
  }
  dialog#detail .frame { display: grid; grid-template-rows: auto 1fr; max-height: 86vh; }
  dialog#detail .bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }
  dialog#detail .bar .title { font-family: var(--mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  dialog#detail .body { overflow: auto; padding: 14px; display: grid; gap: 14px; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--border); max-height: 34vh; }
    td.date, th.date { display: none; }
    header .endpoint { display: none; }
  }
</style>
</head>
<body>
<header>
  <span class="brand"><span class="dot"></span>LocalS3</span>
  <nav class="modes" id="modes">
    <button data-mode="objects" class="on" title="Buckets and objects">Objects</button>
    <button data-mode="tables" hidden title="The Iceberg REST catalog and the table buckets">Tables</button>
    <button data-mode="vectors" hidden title="Vector buckets, indexes and vectors">Vectors</button>
  </nav>
  <span class="endpoint" id="endpoint"></span>
  <span class="spacer"></span>
  <button id="connect-open" title="The configuration of DuckDB, the AWS CLI, boto3, PyIceberg and Spark">Connect</button>
  <button id="refresh" title="Reload the buckets and the current folder">Refresh</button>
</header>

<div class="layout">
  <aside>
    <div class="head">
      <h2>
        <span><span id="side-title">Buckets</span> <span id="bucket-count"></span></span>
        <button id="new-bucket-open" title="Create a bucket">+ NEW</button>
      </h2>
      <input type="search" id="bucket-filter" placeholder="Filter" autocomplete="off" spellcheck="false">
    </div>
    <div class="buckets" id="buckets"></div>
  </aside>

  <main>
    <div class="toolbar">
      <nav class="crumbs" id="crumbs"></nav>
      <div class="tools" id="object-tools">
        <input type="search" class="filter" id="key-filter" placeholder="Filter by prefix" autocomplete="off"
               spellcheck="false">
        <select id="share-expiry" title="How long a link that Share copies is valid">
          <option value="900">Share for 15 min</option>
          <option value="3600" selected>Share for 1 hour</option>
          <option value="86400">Share for 1 day</option>
          <option value="604800">Share for 7 days</option>
        </select>
        <button id="upload" title="Upload files into this prefix">Upload</button>
        <input type="file" id="files" multiple hidden>
      </div>
    </div>
    <div class="content" id="content"></div>
    <div class="dropzone" id="dropzone">
      <div>
        <span id="dropzone-text">Drop to upload</span>
        <small>Files and folders keep their names; a folder becomes a prefix.</small>
      </div>
    </div>
  </main>
</div>

<dialog id="preview">
  <div class="frame">
    <div class="bar">
      <span class="title" id="preview-title"></span>
      <span class="spacer" style="flex:1"></span>
      <span class="meta" id="preview-meta"></span>
      <button id="preview-query" title="Query this object with DuckDB">DuckDB SQL</button>
      <button id="preview-share" title="Copy a presigned URL of this object">Share</button>
      <a class="btn" id="preview-download" download>Download</a>
      <button id="preview-close">Close</button>
    </div>
    <div class="tabs seg" id="preview-tabs">
      <button data-tab="preview" class="on">Preview</button>
      <button data-tab="properties" title="System and user metadata, and tags">Properties</button>
      <button data-tab="versions" title="The versions and delete markers of this key">Versions</button>
    </div>
    <div class="body" id="preview-body"></div>
  </div>
</dialog>

<dialog id="detail">
  <div class="frame">
    <div class="bar">
      <span class="title" id="detail-title"></span>
      <button id="detail-copy">Copy JSON</button>
      <button id="detail-close">Close</button>
    </div>
    <div class="body" id="detail-body"></div>
  </div>
</dialog>

<div class="uploads" id="uploads" hidden>
  <div class="head">
    <span id="uploads-title">Uploads</span>
    <span style="flex:1"></span>
    <button id="uploads-close">Close</button>
  </div>
  <div class="list" id="uploads-list"></div>
</div>

<dialog id="new-bucket">
  <div class="ask">
    <h3>Create a bucket</h3>
    <input type="text" id="new-bucket-name" placeholder="my-bucket" autocomplete="off" spellcheck="false"
           autocapitalize="off">
    <div class="hint" id="new-bucket-hint">3 to 63 characters: lowercase letters, digits, dots and hyphens.</div>
    <div class="row">
      <button id="new-bucket-cancel">Cancel</button>
      <button id="new-bucket-create">Create</button>
    </div>
  </div>
</dialog>

<dialog id="confirm">
  <div class="ask">
    <h3 id="confirm-title">Delete this object?</h3>
    <div class="target" id="confirm-target"></div>
    <div class="row">
      <button id="confirm-cancel">Cancel</button>
      <button id="confirm-ok" class="danger">Delete</button>
    </div>
  </div>
</dialog>

<dialog id="connect">
  <div class="frame">
    <div class="bar">
      <span class="title">Connect to LocalS3</span>
      <span class="meta" id="connect-endpoint"></span>
    </div>
    <div class="tabs" id="connect-tabs"></div>
    <div>
      <div class="query" id="connect-query" hidden>
        <code id="connect-query-text"></code>
        <button id="connect-query-copy" title="Copy the query alone">Copy query</button>
      </div>
      <pre id="connect-snippet"></pre>
    </div>
    <div class="row">
      <button id="connect-copy">Copy</button>
      <button id="connect-close">Close</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var API = "/_admin/ui";
  var state = {
    mode: "objects", features: {tables: false, vectors: false},
    buckets: [], bucket: null, prefix: "", filter: "", rows: null, token: null, truncated: false,
    // The object that the preview shows, with the version it shows; null for the current version.
    current: null,
    tables: {catalogs: null, catalog: null, namespace: [], table: null},
    vectors: {buckets: null, bucket: null, index: null, rows: null, token: null}
  };

  var $ = function (id) { return document.getElementById(id); };

  /* Elements are built rather than templated: an object key is data, and never markup. */
  function el(tag, props, children) {
    var node = document.createElement(tag);
    Object.keys(props || {}).forEach(function (key) {
      if (key === "class") { node.className = props[key]; }
      else if (key === "text") { node.textContent = props[key]; }
      else if (key.slice(0, 2) === "on") { node.addEventListener(key.slice(2), props[key]); }
      else if (props[key] !== null && props[key] !== undefined) { node.setAttribute(key, props[key]); }
    });
    (children || []).forEach(function (child) { node.appendChild(child); });
    return node;
  }

  var ICONS = {
    folder: "M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z",
    file: "M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm7 1.5V9h4.5",
    table: "M4 5h16v14H4zM4 10h16M4 15h16M10 10v9",
    view: "M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12zm10 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6z",
    index: "M5 4h14v16H5zM9 8h6M9 12h6M9 16h3",
    vector: "M5 19L19 5M19 5h-6M19 5v6"
  };

  function icon(name) {
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "icon");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.6");
    svg.setAttribute("stroke-linejoin", "round");
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", ICONS[name]);
    svg.appendChild(path);
    return svg;
  }

  function query(params) {
    return Object.keys(params)
      .filter(function (key) { return params[key] !== null && params[key] !== undefined && params[key] !== ""; })
      .map(function (key) { return encodeURIComponent(key) + "=" + encodeURIComponent(params[key]); })
      .join("&");
  }

  function api(path, params) {
    var url = API + path + (params ? "?" + query(params) : "");
    return fetch(url, {credentials: "same-origin", headers: {"Accept": "application/json"}}).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) { throw new Error(body.message || (res.status + " " + res.statusText)); }
        return body;
      });
    });
  }

  /* The header that says a write came from the console rather than from another page of the browser. */
  var WRITE_HEADERS = {"X-LocalS3-Console": "1"};

  function del(params) {
    return fetch(API + "/object?" + query(params), {
      method: "DELETE", credentials: "same-origin", headers: WRITE_HEADERS
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) { throw new Error(body.message || (res.status + " " + res.statusText)); }
        return body;
      });
    });
  }

  function createBucket(name) {
    return fetch(API + "/bucket?" + query({bucket: name}), {
      method: "PUT", credentials: "same-origin", headers: WRITE_HEADERS
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) { throw new Error(body.message || (res.status + " " + res.statusText)); }
        return body;
      });
    });
  }

  /* Uploads go through XMLHttpRequest rather than fetch, which reports no progress of a request body. */
  function xhr(method, url, body, contentType, onProgress) {
    return new Promise(function (resolve, reject) {
      var request = new XMLHttpRequest();
      request.open(method, url);
      request.setRequestHeader("X-LocalS3-Console", "1");
      if (contentType) { request.setRequestHeader("Content-Type", contentType); }
      if (onProgress) {
        request.upload.addEventListener("progress", function (event) {
          if (event.lengthComputable) { onProgress(event.loaded); }
        });
      }
      request.addEventListener("load", function () {
        var answer = {};
        try { answer = JSON.parse(request.responseText); } catch (e) { /* not JSON */ }
        if (request.status >= 200 && request.status < 300) {
          resolve(answer);
          return;
        }
        reject(new Error(answer.message || (request.status + " " + request.statusText)));
      });
      request.addEventListener("error", function () { reject(new Error("The connection failed.")); });
      request.addEventListener("abort", function () { reject(new Error("Cancelled.")); });
      request.send(body);
    });
  }

  /*
   * A file larger than MULTIPART_THRESHOLD is uploaded in parts, like an S3 client uploads it, so that no request is
   * larger than a part: a single PUT of a large dataset would outgrow the largest body the service accepts.
   */
  var MULTIPART_THRESHOLD = 64 * 1024 * 1024;
  var PART_SIZE = 16 * 1024 * 1024;
  var MAX_PARTS = 10000;
  var PARALLEL_PARTS = 3;

  function put(file, bucket, key, onProgress) {
    if (file.size > MULTIPART_THRESHOLD) {
      return putInParts(file, bucket, key, onProgress);
    }
    return xhr("PUT", API + "/object?" + query({bucket: bucket, key: key}), file, file.type, function (loaded) {
      onProgress(loaded, file.size);
    }).then(function () { onProgress(file.size, file.size); });
  }

  function putInParts(file, bucket, key, onProgress) {
    var params = {bucket: bucket, key: key};
    // Parts of 16 MB, or larger ones for a file that would otherwise take more parts than S3 allows.
    var partSize = Math.max(PART_SIZE, Math.ceil(file.size / MAX_PARTS));
    var count = Math.ceil(file.size / partSize);
    var loaded = new Array(count).fill(0);
    var etags = new Array(count);
    var report = function () {
      onProgress(loaded.reduce(function (sum, bytes) { return sum + bytes; }, 0), file.size);
    };

    return xhr("POST", API + "/multipart?" + query(params), null, file.type).then(function (created) {
      var uploadId = created.uploadId;
      var next = 0;
      var failed = null;
      var worker = function () {
        if (failed || next >= count) { return Promise.resolve(); }
        var index = next++;
        var start = index * partSize;
        var part = file.slice(start, Math.min(start + partSize, file.size));
        var url = API + "/multipart?" + query({bucket: bucket, key: key, uploadId: uploadId, partNumber: index + 1});
        return xhr("PUT", url, part, "application/octet-stream", function (bytes) {
          loaded[index] = bytes;
          report();
        }).then(function (stored) {
          loaded[index] = part.size;
          etags[index] = stored.etag;
          report();
          return worker();
        }, function (error) {
          failed = failed || error;
        });
      };
      var workers = [];
      for (var i = 0; i < Math.min(PARALLEL_PARTS, count); i++) { workers.push(worker()); }
      return Promise.all(workers).then(function () {
        if (failed) { throw failed; }
        var parts = etags.map(function (etag, index) { return {partNumber: index + 1, etag: etag}; });
        return xhr("POST", API + "/multipart/complete?" + query({bucket: bucket, key: key, uploadId: uploadId}),
          JSON.stringify({parts: parts}), "application/json");
      }).catch(function (error) {
        // Drop the parts that were stored, so a failed upload leaves nothing behind; the error is what is reported.
        var abort = API + "/multipart?" + query({bucket: bucket, key: key, uploadId: uploadId});
        return xhr("DELETE", abort, null, null).then(function () { throw error; }, function () { throw error; });
      });
    });
  }

  function objectUrl(bucket, key, download, versionId) {
    return API + "/object?" + query({bucket: bucket, key: key, download: download ? "1" : null,
      versionId: versionId || null});
  }

  /* How long a shared link is valid, in seconds: the choice of the toolbar, which is remembered in this browser. */
  var SHARE_EXPIRY_KEY = "locals3.console.shareExpiry";

  function shareExpiry() {
    return $("share-expiry").value;
  }

  function expiryText(seconds) {
    if (seconds % 86400 === 0) { return seconds / 86400 + (seconds === 86400 ? " day" : " days"); }
    if (seconds % 3600 === 0) { return seconds / 3600 + (seconds === 3600 ? " hour" : " hours"); }
    return Math.round(seconds / 60) + " min";
  }

  /*
   * Copy a presigned URL of an object, which a browser or a client without credentials reads it with. The URL is
   * fetched after the click, so the copy is handed to the clipboard as a promise where the browser supports it:
   * Safari refuses a writeText that no longer runs in the click.
   */
  function share(bucket, key) {
    var signed = api("/presign", {bucket: bucket, key: key, expires: shareExpiry()});
    var done = function (body) {
      toast(body.signed ? "Copied a link valid for " + expiryText(body.expiresIn)
        : "Copied the URL, which never expires: the service has no credentials");
    };
    var failed = function (error) { toast(error.message); };
    if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) {
      var text = signed.then(function (body) { return new Blob([body.url], {type: "text/plain"}); });
      navigator.clipboard.write([new ClipboardItem({"text/plain": text})]).then(function () {
        return signed.then(done);
      }, function () {
        // The clipboard refused the promise; copy the URL the older way, and leave a failure to the catch below.
        signed.then(function (body) { copy(body.url, "the link"); }, function () {});
      });
      signed.catch(failed);
      return;
    }
    signed.then(function (body) { copy(body.url, "the link"); }, failed);
  }

  function size(bytes) {
    if (bytes < 1024) { return bytes + " B"; }
    var units = ["KB", "MB", "GB", "TB"];
    var value = bytes / 1024;
    var unit = 0;
    while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
    return (value < 10 ? value.toFixed(1) : Math.round(value)) + " " + units[unit];
  }

  function when(iso) {
    if (!iso) { return ""; }
    var date = new Date(iso);
    return isNaN(date.getTime()) ? iso : date.toLocaleString();
  }

  var toastTimer;
  function toast(message) {
    var node = $("toast");
    node.textContent = message;
    node.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { node.classList.remove("on"); }, 1600);
  }

  function copy(text, label) {
    var done = function () { toast("Copied " + (label || text)); };
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(done, function () { toast(text); });
      return;
    }
    var input = el("input", {type: "text", value: text});
    document.body.appendChild(input);
    input.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast(text); }
    document.body.removeChild(input);
  }

  /* The location of the page: #/bucket/prefix, so that a folder is a link and the back button walks up. */
  function readHash() {
    var hash = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    var slash = hash.indexOf("/");
    if (!hash) { return {bucket: null, prefix: ""}; }
    return slash < 0 ? {bucket: hash, prefix: ""}
      : {bucket: hash.slice(0, slash), prefix: hash.slice(slash + 1)};
  }

  function go(bucket, prefix) {
    var hash = bucket ? "#/" + encodeURIComponent(bucket + "/" + (prefix || "")).replace(/%2F/g, "/") : "#/";
    if (location.hash === hash) { route(); } else { location.hash = hash; }
  }

  /*
   * The views of the page. Objects keep the #/bucket/prefix of the first console, so its links still work; the
   * others are #tables?... and #vectors?..., whose parameters name what is open.
   */
  function goView(mode, params) {
    var rest = query(params || {});
    var hash = "#" + mode + (rest ? "?" + rest : "");
    if (location.hash === hash) { route(); } else { location.hash = hash; }
  }

  function route() {
    var match = /^#(tables|vectors)(?:\?(.*))?$/.exec(location.hash);
    if (!match) {
      setMode("objects");
      var target = readHash();
      open(target.bucket, target.prefix);
      return;
    }
    var params = new URLSearchParams(match[2] || "");
    setMode(match[1]);
    if (match[1] === "tables") {
      openTables(params.get("tableBucket") ? {tableBucket: params.get("tableBucket")}
          : params.get("catalog") === "iceberg" ? {tableBucket: ""} : null,
        params.get("namespace") ? params.get("namespace").split(NS) : [], params.get("table"));
    } else {
      openVectors(params.get("bucket"), params.get("index"));
    }
  }

  function setMode(mode) {
    var changed = state.mode !== mode;
    state.mode = mode;
    Array.prototype.forEach.call($("modes").children, function (button) {
      button.classList.toggle("on", button.getAttribute("data-mode") === mode);
    });
    $("object-tools").hidden = mode !== "objects";
    $("new-bucket-open").hidden = mode !== "objects";
    $("side-title").textContent = {objects: "Buckets", tables: "Catalogs", vectors: "Vector buckets"}[mode];
    if (changed) {
      $("bucket-filter").value = "";
      if (mode === "tables" && !state.tables.catalogs) { loadCatalogs(); }
      if (mode === "vectors" && !state.vectors.buckets) { loadVectorBuckets(); }
    }
    renderSidebar();
  }

  function renderSidebar() {
    if (state.mode === "tables") { renderCatalogs(); }
    else if (state.mode === "vectors") { renderVectorBuckets(); }
    else { renderBuckets(); }
  }

  /* The items of the sidebar that match its filter, or what to say when none does. */
  function sidebar(items, name, empty, render) {
    var filter = $("bucket-filter").value.trim().toLowerCase();
    var shown = (items || []).filter(function (item) {
      return !filter || name(item).toLowerCase().indexOf(filter) >= 0;
    });
    $("bucket-count").textContent = items && items.length ? String(items.length) : "";
    if (!items) {
      $("buckets").replaceChildren(el("div", {class: "state", text: "Loading…"}));
    } else if (!shown.length) {
      $("buckets").replaceChildren(el("div", {class: "state", text: items.length ? "Nothing matches." : empty}));
    } else {
      $("buckets").replaceChildren.apply($("buckets"), shown.map(render));
    }
  }

  /* Buckets. */

  function loadBuckets() {
    return api("/buckets").then(function (body) {
      state.buckets = body.buckets || [];
      if (state.mode === "objects") { renderBuckets(); }
    }).catch(function (error) {
      if (state.mode === "objects") {
        $("buckets").replaceChildren(el("div", {class: "state error", text: error.message}));
      }
    });
  }

  function renderBuckets() {
    var filter = $("bucket-filter").value.trim().toLowerCase();
    var shown = state.buckets.filter(function (bucket) {
      return !filter || bucket.name.toLowerCase().indexOf(filter) >= 0;
    });
    $("bucket-count").textContent = state.buckets.length ? String(state.buckets.length) : "";
    if (!shown.length) {
      $("buckets").replaceChildren(el("div", {
        class: "state",
        text: state.buckets.length ? "No bucket matches." : "No buckets yet."
      }));
      return;
    }
    $("buckets").replaceChildren.apply($("buckets"), shown.map(function (bucket) {
      return el("button", {
        class: "bucket" + (bucket.name === state.bucket ? " active" : ""),
        onclick: function () { go(bucket.name, ""); }
      }, [
        el("span", {text: bucket.name}),
        el("small", {text: bucket.region + " · " + when(bucket.creationDate)})
      ]);
    }));
  }

  /* Objects. */

  function open(bucket, prefix) {
    state.current = null;
    state.bucket = bucket;
    state.prefix = prefix || "";
    state.rows = null;
    state.token = null;
    state.truncated = false;
    $("key-filter").value = state.filter = "";
    renderBuckets();
    renderCrumbs();
    if (!bucket) {
      $("content").replaceChildren(el("div", {class: "state", text: "Pick a bucket to see what is in it."}));
      return;
    }
    listObjects();
  }

  /* List the current prefix again, keeping where the user is, e.g. after an upload or a delete. */
  function reload() {
    state.rows = null;
    state.token = null;
    return listObjects();
  }

  function listObjects() {
    var bucket = state.bucket;
    var loading = el("div", {class: "state", text: "Loading…"});
    if (!state.rows) { $("content").replaceChildren(loading); }
    return api("/objects", {
      bucket: bucket,
      prefix: state.prefix + state.filter,
      "continuation-token": state.token
    }).then(function (body) {
      if (state.bucket !== bucket) { return; }
      var page = (body.prefixes || []).map(function (prefix) { return {prefix: prefix}; })
        .concat(body.objects || []);
      state.rows = (state.rows || []).concat(page);
      state.truncated = !!body.truncated;
      state.token = body.nextContinuationToken || null;
      renderObjects();
    }).catch(function (error) {
      if (state.bucket !== bucket) { return; }
      $("content").replaceChildren(el("div", {class: "state error", text: error.message}));
    });
  }

  function renderCrumbs() {
    var crumbs = $("crumbs");
    if (!state.bucket) { crumbs.replaceChildren(); return; }
    var nodes = [el("button", {text: state.bucket, onclick: function () { go(state.bucket, ""); }})];
    var walked = "";
    state.prefix.split("/").filter(Boolean).forEach(function (segment) {
      walked += segment + "/";
      var target = walked;
      nodes.push(el("span", {text: "/"}));
      nodes.push(el("button", {text: segment, onclick: function () { go(state.bucket, target); }}));
    });
    nodes.push(el("span", {text: "/"}));
    crumbs.replaceChildren.apply(crumbs, nodes);
  }

  function renderObjects() {
    var rows = state.rows || [];
    if (!rows.length) {
      $("content").replaceChildren(el("div", {class: "state"}, [
        el("p", {text: state.prefix || state.filter ? "Nothing under this prefix." : "This bucket is empty."}),
        el("p", {text: "Drop files here to upload them."})
      ]));
      return;
    }

    var body = el("tbody", {}, rows.map(function (row) {
      return row.prefix ? folderRow(row.prefix) : objectRow(row);
    }));
    var table = el("table", {}, [
      el("thead", {}, [el("tr", {}, [
        el("th", {class: "name", text: "Name"}),
        el("th", {class: "num", text: "Size"}),
        el("th", {class: "date", text: "Last modified"}),
        el("th", {text: ""})
      ])]),
      body
    ]);

    var children = [table];
    if (state.truncated) {
      var more = el("button", {text: "Load more", onclick: function () {
        more.disabled = true;
        more.textContent = "Loading…";
        listObjects();
      }});
      children.push(el("div", {class: "more"}, [more]));
    }
    $("content").replaceChildren.apply($("content"), children);
  }

  function folderRow(prefix) {
    var name = prefix.slice(state.prefix.length).replace(/\/$/, "");
    return el("tr", {}, [
      el("td", {class: "name"}, [
        el("button", {class: "entry", onclick: function () { go(state.bucket, prefix); }}, [
          icon("folder"), el("span", {class: "label", text: name || prefix})
        ])
      ]),
      el("td", {class: "num", text: "—"}),
      el("td", {class: "date", text: ""}),
      el("td", {class: "actions"})
    ]);
  }

  function objectRow(object) {
    var name = object.key.slice(state.prefix.length) || object.key;
    return el("tr", {}, [
      el("td", {class: "name"}, [
        el("button", {class: "entry", title: object.key, onclick: function () { preview(object); }}, [
          icon("file"), el("span", {class: "label", text: name})
        ])
      ]),
      el("td", {class: "num", text: size(object.size)}),
      el("td", {class: "date", text: when(object.lastModified)}),
      el("td", {class: "actions"}, [
        el("a", {class: "btn", href: objectUrl(state.bucket, object.key, true), download: "", text: "Download"}),
        el("button", {
          text: "Share",
          title: "Copy a presigned URL of this object, which works without credentials until it expires",
          onclick: function () { share(state.bucket, object.key); }
        }),
        el("button", {
          class: "danger",
          text: "Delete",
          title: "Delete this object",
          onclick: function () { remove(object); }
        })
      ])
    ]);
  }

  /* Preview. */

  var TEXT = /\.(txt|log|md|markdown|json|jsonl|ndjson|xml|ya?ml|csv|tsv|ini|toml|properties|conf|cfg|sql|sh|bash|zsh|py|rb|go|rs|java|kt|scala|c|h|cpp|js|mjs|ts|tsx|jsx|css|scss|env|gitignore|dockerfile|avsc)$/i;
  var IMAGE = /\.(png|jpe?g|gif|webp|avif|bmp|ico|svg)$/i;
  var VIDEO = /\.(mp4|webm|ogv|mov)$/i;
  var AUDIO = /\.(mp3|wav|ogg|flac|m4a|aac)$/i;
  var FRAME = /\.(pdf|html?|xhtml)$/i;
  var MAX_TEXT = 2 * 1024 * 1024;

  /**
   * Open the preview of an object: of its current version, or of the version that object.versionId names, which the
   * Versions tab opens.
   */
  function preview(object, tab) {
    state.current = {key: object.key, size: object.size, lastModified: object.lastModified,
      versionId: object.versionId || null};
    var label = object.key + (object.versionId ? "  @ " + object.versionId : "");
    $("preview-title").textContent = label;
    $("preview-title").title = label;
    $("preview-meta").textContent = size(object.size) + " · " + when(object.lastModified);
    $("preview-download").href = objectUrl(state.bucket, object.key, true, object.versionId);
    if (!$("preview").open) { $("preview").showModal(); }
    showTab(tab || "preview");
  }

  function showTab(tab) {
    Array.prototype.forEach.call($("preview-tabs").children, function (button) {
      button.classList.toggle("on", button.getAttribute("data-tab") === tab);
    });
    var body = $("preview-body");
    body.replaceChildren(el("div", {class: "state", text: "Loading…"}));
    if (tab === "properties") { showProperties(state.current); }
    else if (tab === "versions") { showVersions(state.current); }
    else { showContent(state.current); }
  }

  function showContent(object) {
    var url = objectUrl(state.bucket, object.key, false, object.versionId);
    var body = $("preview-body");
    if (IMAGE.test(object.key)) {
      body.replaceChildren(el("img", {src: url, alt: object.key}));
    } else if (VIDEO.test(object.key)) {
      body.replaceChildren(el("video", {src: url, controls: ""}));
    } else if (AUDIO.test(object.key)) {
      body.replaceChildren(el("audio", {src: url, controls: ""}));
    } else if (FRAME.test(object.key)) {
      body.replaceChildren(el("iframe", {src: url, sandbox: "allow-scripts allow-popups allow-downloads"}));
    } else if (TEXT.test(object.key) || object.size === 0) {
      showText(object, url);
    } else {
      body.replaceChildren(el("div", {class: "state"}, [
        el("p", {text: "No preview for this file type."}),

  /* The S3 Vectors API answers its times in seconds. */
  function seconds(value) {
    return value ? when(new Date(value * 1000).toISOString()) : "";
  }

  function renderVectorBuckets() {
    sidebar(state.vectors.buckets, function (bucket) { return bucket.vectorBucketName; },
      "No vector buckets yet.", function (bucket) {
        return el("button", {
          class: "bucket" + (bucket.vectorBucketName === state.vectors.bucket ? " active" : ""),
          title: bucket.vectorBucketArn,
          onclick: function () { goView("vectors", {bucket: bucket.vectorBucketName}); }
        }, [el("span", {text: bucket.vectorBucketName}), el("small", {text: seconds(bucket.creationTime)})]);
      });
  }

  function openVectors(bucket, index) {
    state.vectors.bucket = bucket;
    state.vectors.index = index;
    state.vectors.rows = null;
    state.vectors.token = null;
    renderSidebar();
    var crumbs = [];
    if (bucket) {
      crumbs.push(el("button", {text: bucket, onclick: function () { goView("vectors", {bucket: bucket}); }}));
      if (index) {
        crumbs.push(el("span", {text: "/"}));
        crumbs.push(el("button", {text: index, onclick: function () {
          goView("vectors", {bucket: bucket, index: index});
        }}));
      }
    }
    $("crumbs").replaceChildren.apply($("crumbs"), crumbs);
    if (!bucket) {
      $("content").replaceChildren(el("div", {class: "state", text: "Pick a vector bucket to see its indexes."}));
      return;
    }
    $("content").replaceChildren(el("div", {class: "state", text: "Loading…"}));
    if (index) { listVectors(); } else { showIndexes(bucket); }
  }

  function showIndexes(bucket) {
    api("/vector-indexes", {vectorBucket: bucket}).then(function (answer) {
      if (state.mode !== "vectors" || state.vectors.bucket !== bucket || state.vectors.index) { return; }
      var indexes = answer.indexes || [];
      if (!indexes.length) {
        $("content").replaceChildren(el("div", {class: "state", text: "This vector bucket has no indexes yet."}));
        return;
      }
      $("content").replaceChildren(el("table", {}, [
        el("thead", {}, [el("tr", {}, [
          el("th", {text: "Index"}), el("th", {class: "num", text: "Dimension"}), el("th", {text: "Metric"}),
          el("th", {text: "Type"}), el("th", {class: "num", text: "Vectors"}),
          el("th", {text: "Non-filterable metadata"}), el("th", {class: "date", text: "Created"})
        ])]),
        el("tbody", {}, indexes.map(function (index) {
          var keys = ((index.metadataConfiguration || {}).nonFilterableMetadataKeys || []).join(", ");
          return el("tr", {}, [
            el("td", {class: "name"}, [entryButton("index", index.indexName, function () {
              goView("vectors", {bucket: bucket, index: index.indexName});
            }, index.indexArn)]),
            el("td", {class: "num", text: String(index.dimension)}),
            el("td", {text: index.distanceMetric || ""}),
            el("td", {text: index.dataType || ""}),
            el("td", {class: "num", text: index.vectorCount === null || index.vectorCount === undefined ? ""
              : String(index.vectorCount)}),
            el("td", {class: "mono", text: keys}),
            el("td", {class: "date", text: seconds(index.creationTime)})
          ]);
        }))
      ]));
    }).catch(function (error) {
      $("content").replaceChildren(el("div", {class: "state error", text: error.message}));
    });
  }

  function listVectors() {
    var bucket = state.vectors.bucket;
    var index = state.vectors.index;
    return api("/vectors", {vectorBucket: bucket, index: index, nextToken: state.vectors.token}).then(function (body) {
      if (state.mode !== "vectors" || state.vectors.bucket !== bucket || state.vectors.index !== index) { return; }
      state.vectors.rows = (state.vectors.rows || []).concat(body.vectors || []);
      state.vectors.token = body.nextToken || null;
      renderVectors();
    }).catch(function (error) {
      $("content").replaceChildren(el("div", {class: "state error", text: error.message}));
    });
  }

  function renderVectors() {
    var rows = state.vectors.rows || [];
    if (!rows.length) {
      $("content").replaceChildren(el("div", {class: "state", text: "This index holds no vectors yet."}));
      return;
    }
    var table = el("table", {}, [
      el("thead", {}, [el("tr", {}, [el("th", {text: "Key"}), el("th", {text: "Metadata"}), el("th", {text: ""})])]),
      el("tbody", {}, rows.map(function (vector) {
        var metadata = vector.metadata === null || vector.metadata === undefined ? "" : JSON.stringify(vector.metadata);
        return el("tr", {}, [
          el("td", {class: "name"}, [entryButton("vector", vector.key, function () { showVector(vector.key); })]),
          el("td", {}, [el("div", {class: "clip mono", text: metadata, title: metadata})]),
          el("td", {class: "actions"}, [el("button", {text: "Show", onclick: function () { showVector(vector.key); }})])
        ]);
      }))
    ]);
    var children = [table];
    if (state.vectors.token) {
      var more = el("button", {text: "Load more", onclick: function () {
        more.disabled = true;
        more.textContent = "Loading…";
        listVectors();
      }});
      children.push(el("div", {class: "more"}, [more]));
    }
    $("content").replaceChildren.apply($("content"), children);
  }

  var detailJson = "";

  function showVector(key) {
    $("detail-title").textContent = state.vectors.index + " / " + key;
    $("detail-body").replaceChildren(el("div", {class: "state", text: "Loading…"}));
    detailJson = "";
    $("detail").showModal();
    api("/vector", {vectorBucket: state.vectors.bucket, index: state.vectors.index, key: key}).then(function (vector) {
      var values = (vector.data && vector.data.float32) || [];
      var norm = Math.sqrt(values.reduce(function (sum, value) { return sum + value * value; }, 0));
      detailJson = JSON.stringify(vector, null, 2);
      $("detail-body").replaceChildren(
        kv([["Key", vector.key], ["Dimension", values.length], ["L2 norm", values.length ? norm.toFixed(6) : null]]),
        section("Metadata", el("pre", {text: vector.metadata === null || vector.metadata === undefined ? "{}"
          : JSON.stringify(vector.metadata, null, 2)})),
        section("Data (float32)", el("pre", {text: "[" + values.join(", ") + "]"})));
    }).catch(function (error) {
      $("detail-body").replaceChildren(el("div", {class: "state error", text: error.message}));
    });
  }

  /* Uploading. */

  /* At most this many files are sent at once, so a folder of many small files doesn't open a socket per file. */
  var PARALLEL_UPLOADS = 3;
  var queue = [];
  var running = 0;

  /**
   * Upload files into the prefix that is open, each under its own name; a file dropped as part of a folder keeps the
   * path inside that folder, so the folder becomes a prefix.
   */
  function upload(files) {
    if (!state.bucket || !files.length) { return; }
    var bucket = state.bucket;
    files.forEach(function (entry) {
      queue.push({
        bucket: bucket,
        key: state.prefix + (entry.path || entry.file.name),
        file: entry.file,
        loaded: 0,
        total: entry.file.size,
        status: "waiting"
      });
    });
    renderUploads();
    pump();
  }

  function pump() {
    while (running < PARALLEL_UPLOADS) {
      var next = queue.find(function (item) { return item.status === "waiting"; });
      if (!next) { break; }
      running++;
      next.status = "sending";
      send(next);
    }
    renderUploads();
  }

  function send(item) {
    put(item.file, item.bucket, item.key, function (loaded, total) {
      item.loaded = loaded;
      item.total = total || item.total;
      renderUploads();
    }).then(function () {
      item.status = "done";
    }, function (error) {
      item.status = "failed";
      item.error = error.message;
    }).then(function () {
      running--;
      renderUploads();
      pump();
      // Show what landed as soon as the batch is quiet, and only for the bucket that is still open.
      if (!running && item.bucket === state.bucket) {
        reload();
      }
    });
  }

  function renderUploads() {
    var panel = $("uploads");
    if (!queue.length) { panel.hidden = true; return; }
    panel.hidden = false;

    var done = queue.filter(function (item) { return item.status === "done"; }).length;
    var failed = queue.filter(function (item) { return item.status === "failed"; }).length;
    $("uploads-title").textContent = running || done + failed < queue.length
      ? "Uploading " + (done + failed + 1) + " of " + queue.length
      : queue.length + " uploaded" + (failed ? ", " + failed + " failed" : "");

    var list = $("uploads-list");
    list.replaceChildren.apply(list, queue.map(function (item) {
      var percent = item.total ? Math.round(100 * item.loaded / item.total) : 100;
      var status = item.status === "failed" ? item.error
        : item.status === "done" ? size(item.total)
        : item.status === "waiting" ? "waiting" : percent + "%";
      return el("div", {class: "upload " + item.status}, [
        el("div", {class: "line"}, [
          el("span", {class: "key", text: item.key, title: item.key}),
          el("span", {class: "status", text: status})
        ]),
        el("div", {class: "bar"}, [
          el("i", {style: "width:" + (item.status === "done" || item.status === "failed" ? 100 : percent) + "%"})
        ])
      ]);
    }));
  }

  /**
   * The files of a drop, with the path each one keeps: a dropped folder is walked, so its files are uploaded under
   * the prefix of the folder. A browser without the entry API drops its files without their paths.
   */
  function droppedFiles(transfer) {
    var entries = Array.prototype.map.call(transfer.items || [], function (item) {
      return item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
    }).filter(Boolean);
    if (!entries.length) {
      return Promise.resolve(Array.prototype.map.call(transfer.files, function (file) { return {file: file}; }));
    }
    return Promise.all(entries.map(function (entry) { return walk(entry, ""); }))
      .then(function (found) { return found.flat(); });
  }

  function walk(entry, path) {
    if (entry.isFile) {
      return new Promise(function (resolve) {
        entry.file(function (file) { resolve([{file: file, path: path + file.name}]); },
          function () { resolve([]); });
      });
    }
    var reader = entry.createReader();
    var children = [];
    // readEntries answers a batch at a time, and an empty batch means the directory is read to its end.
    var readBatch = function () {
      return new Promise(function (resolve) {
        reader.readEntries(function (batch) {
          if (!batch.length) { resolve(children); return; }
          children = children.concat(batch);
          resolve(readBatch());
        }, function () { resolve(children); });
      });
    };
    return readBatch().then(function (found) {
      return Promise.all(found.map(function (child) { return walk(child, path + entry.name + "/"); }));
    }).then(function (found) { return found.flat(); });
  }

  /* Deleting. */

  var confirmed;

  function ask(target, title) {
    $("confirm-title").textContent = title || "Delete this object?";
    $("confirm-target").textContent = target;
    $("confirm").showModal();
    return new Promise(function (resolve) { confirmed = resolve; });
  }

  function remove(object) {
    ask(state.bucket + "/" + object.key).then(function (yes) {
      if (!yes) { return; }
      del({bucket: state.bucket, key: object.key}).then(function () {
        toast("Deleted " + object.key);
        reload();
      }, function (error) {
        toast(error.message);
      });
    });
  }

  /* Creating a bucket. */

  function openNewBucket() {
    $("new-bucket-name").value = "";
    hint("3 to 63 characters: lowercase letters, digits, dots and hyphens.", false);
    $("new-bucket").showModal();
    $("new-bucket-name").focus();
  }

  function hint(message, isError) {
    var node = $("new-bucket-hint");
    node.textContent = message;
    node.classList.toggle("error", !!isError);
  }

  function submitNewBucket() {
    var name = $("new-bucket-name").value.trim();
    if (!name) { hint("A bucket needs a name.", true); return; }
    $("new-bucket-create").disabled = true;
    hint("Creating…", false);
    createBucket(name).then(function (bucket) {
      $("new-bucket-create").disabled = false;
      $("new-bucket").close();
      toast("Created " + bucket.name);
      // Show it in the sidebar, and open it: an empty bucket is where files are dropped next.
      loadBuckets().then(function () { go(bucket.name, ""); });
    }, function (error) {
      $("new-bucket-create").disabled = false;
      // What the service rejected the name with, e.g. a name that is taken or breaks the naming rules.
      hint(error.message, true);
    });
  }

  /* Connect: the configuration of the clients, written by the service for the bucket or the object shown. */

  var connect = {snippets: [], selected: "duckdb", query: null};

  function openConnect(bucket, key) {
    $("connect-snippet").textContent = "Loading…";
    $("connect-query").hidden = true;
    $("connect-tabs").replaceChildren();
    $("connect").showModal();
    api("/snippets", {bucket: bucket, key: key}).then(function (body) {
      connect.snippets = body.snippets || [];
      connect.query = body.duckdbQuery || null;
      $("connect-endpoint").textContent = body.endpoint || "";
      renderConnect();
    }).catch(function (error) {
      $("connect-snippet").textContent = error.message;
    });
  }

  function selectedSnippet() {
    return connect.snippets.find(function (snippet) { return snippet.id === connect.selected; })
      || connect.snippets[0];
  }

  function renderConnect() {
    var current = selectedSnippet();
    $("connect-tabs").replaceChildren.apply($("connect-tabs"), connect.snippets.map(function (snippet) {
      return el("button", {
        class: current && snippet.id === current.id ? "on" : "",
        text: snippet.title,
        onclick: function () { connect.selected = snippet.id; renderConnect(); }
      });
    }));
    $("connect-snippet").textContent = current ? current.content : "";
    // The query alone is what is pasted into a DuckDB that already has the secret.
    var showQuery = !!connect.query && current && current.id === "duckdb";
    $("connect-query").hidden = !showQuery;
    $("connect-query-text").textContent = showQuery ? connect.query : "";
  }

  /* Wiring. */

  var filterTimer;
  $("key-filter").addEventListener("input", function () {
    clearTimeout(filterTimer);
    filterTimer = setTimeout(function () {
      state.filter = $("key-filter").value;
      state.rows = null;
      state.token = null;
      listObjects();
    }, 200);
  });
  $("bucket-filter").addEventListener("input", renderSidebar);
  $("refresh").addEventListener("click", function () {
    if (state.mode === "tables") { state.tables.catalogs = null; loadCatalogs(); route(); return; }
    if (state.mode === "vectors") { state.vectors.buckets = null; loadVectorBuckets(); route(); return; }
    loadBuckets();
    if (state.bucket) { open(state.bucket, state.prefix); }
  });
  Array.prototype.forEach.call($("modes").children, function (button) {
    button.addEventListener("click", function () {
      var mode = button.getAttribute("data-mode");
      if (mode === state.mode) { return; }
      if (mode === "objects") { go(state.bucket, state.bucket ? state.prefix : ""); }
      else if (mode === "tables") { goTable(state.tables.catalog, state.tables.namespace, state.tables.table); }
      else { goView("vectors", {bucket: state.vectors.bucket, index: state.vectors.index}); }
    });
  });
  $("detail-close").addEventListener("click", function () { $("detail").close(); });
  $("detail-copy").addEventListener("click", function () { if (detailJson) { copy(detailJson, "the vector"); } });
  $("preview-close").addEventListener("click", function () { $("preview").close(); });
  $("preview-share").addEventListener("click", function () {
    if (state.current) { share(state.bucket, state.current.key); }
  });
  Array.prototype.forEach.call($("preview-tabs").children, function (button) {
    button.addEventListener("click", function () { if (state.current) { showTab(button.getAttribute("data-tab")); } });
  });
  try {
    var remembered = localStorage.getItem(SHARE_EXPIRY_KEY);
    if (remembered && $("share-expiry").querySelector("option[value='" + remembered + "']")) {
      $("share-expiry").value = remembered;
    }
  } catch (e) { /* No storage, e.g. a private window: the default applies. */ }
  $("share-expiry").addEventListener("change", function () {
    try { localStorage.setItem(SHARE_EXPIRY_KEY, shareExpiry()); } catch (e) { /* Remembered for this page alone. */ }
  });
  $("preview-query").addEventListener("click", function () {
    connect.selected = "duckdb";
    openConnect(state.bucket, state.current ? state.current.key : null);
  });
  $("connect-open").addEventListener("click", function () { openConnect(state.bucket, state.prefix); });
  $("connect-close").addEventListener("click", function () { $("connect").close(); });
  $("connect-copy").addEventListener("click", function () {
    var current = selectedSnippet();
    if (current) { copy(current.content, "the " + current.title + " snippet"); }
  });
  $("connect-query-copy").addEventListener("click", function () {
    if (connect.query) { copy(connect.query); }
  });
  $("upload").addEventListener("click", function () {
    if (!state.bucket) { toast("Pick a bucket first."); return; }
    $("files").click();
  });
  $("files").addEventListener("change", function () {
    upload(Array.prototype.map.call($("files").files, function (file) { return {file: file}; }));
    $("files").value = "";
  });
  $("uploads-close").addEventListener("click", function () {
    queue = queue.filter(function (item) { return item.status === "sending" || item.status === "waiting"; });
    renderUploads();
  });
  $("new-bucket-open").addEventListener("click", openNewBucket);
  $("new-bucket-cancel").addEventListener("click", function () { $("new-bucket").close(); });
  $("new-bucket-create").addEventListener("click", submitNewBucket);
  $("new-bucket-name").addEventListener("keydown", function (event) {
    if (event.key === "Enter") { event.preventDefault(); submitNewBucket(); }
  });
  $("confirm-cancel").addEventListener("click", function () { $("confirm").close(); });
  $("confirm-ok").addEventListener("click", function () { $("confirm").close("delete"); });
  $("confirm").addEventListener("close", function () {
    if (confirmed) { confirmed($("confirm").returnValue === "delete"); confirmed = null; }
  });

  // Dropping anywhere over the listing uploads into the prefix that is open; dragging over the rest of the window
  // must be cancelled as well, or the browser opens the file instead.
  var dragDepth = 0;
  var dropTarget = window.document.querySelector("main");
  ["dragenter", "dragover"].forEach(function (name) {
    dropTarget.addEventListener(name, function (event) {
      if (!state.bucket || state.mode !== "objects") { return; }
      event.preventDefault();
      event.dataTransfer.dropEffect = "copy";
      if (name === "dragenter") { dragDepth++; }
      $("dropzone-text").textContent = "Drop to upload into " + state.bucket + "/" + state.prefix;
      $("dropzone").classList.add("on");
    });
  });
  dropTarget.addEventListener("dragleave", function () {
    if (--dragDepth <= 0) { dragDepth = 0; $("dropzone").classList.remove("on"); }
  });
  dropTarget.addEventListener("drop", function (event) {
    if (!state.bucket || state.mode !== "objects") { return; }
    event.preventDefault();
    dragDepth = 0;
    $("dropzone").classList.remove("on");
    droppedFiles(event.dataTransfer).then(upload);
  });
  window.addEventListener("dragover", function (event) { event.preventDefault(); });
  window.addEventListener("drop", function (event) { event.preventDefault(); });
  $("preview").addEventListener("close", function () { $("preview-body").replaceChildren(); });
  window.addEventListener("hashchange", route);

  $("endpoint").textContent = location.origin;
  route();
  loadBuckets();
  api("/features").then(function (features) {
    state.features = features;
    Array.prototype.forEach.call($("modes").children, function (button) {
      var mode = button.getAttribute("data-mode");
      if (mode !== "objects") { button.hidden = !features[mode] && state.mode !== mode; }
    });
  }).catch(function () { /* The Objects view alone. */ });
})();
</script>
</body>
</html>
