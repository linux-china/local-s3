[versions]
logback = "1.5.38"
awssdkS3 = "2.54.14"
jackson = "3.2.2"
nettyHttpRouter = "1.15"
netty = "4.2.18.Final"
junit5 = "6.1.3"
junitPlatform = "6.1.3"
mockito = "5.23.0"
lombok = "1.18.48"
slf4j = "2.0.19"
testContainers = "2.0.5"
apacheCommonsCompress = "1.28.0"
robothyCnRepo = "1.18"
gradleLombok = "5.0.0"
jspecify="1.0.1"
springBoot = "4.1.1"
# The starter is compiled against Spring Boot 4 and runs on Spring Boot 3 too: springBoot3 is the baseline that the
# Actuator health adapter is compiled against, and that the compatibility tests of the starter run on.
springBoot3 = "3.5.16"
micrometer = "1.17.1"
duckdb="1.5.5.1"
h2MvStore="2.5.250"
iceberg="1.11.0"
parquet="1.17.1"
hadoop="3.5.0"
delta="4.4.0"

[libraries]
logbackClassic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
awssdkS3 = { group = "software.amazon.awssdk", name = "s3", version.ref = "awssdkS3" }
awssdkS3vectors = { group = "software.amazon.awssdk", name = "s3vectors", version.ref = "awssdkS3" }
# iceberg-aws leaves the AWS SDK to the application; its S3FileIO loads the model classes of KMS and STS as well.
awssdkKms = { group = "software.amazon.awssdk", name = "kms", version.ref = "awssdkS3" }
awssdkSts = { group = "software.amazon.awssdk", name = "sts", version.ref = "awssdkS3" }
awss3ApacheClient = { group = "software.amazon.awssdk", name = "apache-client", version.ref = "awssdkS3" }
# Jackson 3, whose annotations are still those of Jackson 2, com.fasterxml.jackson.annotation, which databind brings.
# Optional, java.time and parameter names are supported by databind itself, without modules.
jacksonDatabind = { group = "tools.jackson.core", name = "jackson-databind", version.ref = "jackson" }
jacksonDataformatXml = { group = "tools.jackson.dataformat", name = "jackson-dataformat-xml", version.ref = "jackson" }
nettyHttpRouter = { group = "io.github.robothy", name = "netty-http-router", version.ref = "nettyHttpRouter" }
nettyBom = { group = "io.netty", name = "netty-bom", version.ref = "netty" }
nettyCodecHttp = { group = "io.netty", name = "netty-codec-http", version.ref = "netty" }
nettyHandler = { group = "io.netty", name = "netty-handler", version.ref = "netty" }
nettyTransport = { group = "io.netty", name = "netty-transport", version.ref = "netty" }
h2MvStore = { group = "com.h2database", name = "h2-mvstore", version.ref = "h2MvStore" }
junit5 = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit5" }
junitPlatformLauncher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }
junit5JupiterEngine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit5" }
junit5JupiterApi = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit5" }
#mockitoInline = { group = "org.mockito", name = "mockito-inline", version.ref = "mockito" }
mockitoCore = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
slf4jApi = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
testContainers = { group = "org.testcontainers", name = "testcontainers", version.ref = "testContainers" }
testContainersJunit = { group = "org.testcontainers", name = "testcontainers-junit-jupiter", version.ref = "testContainers" }
apacheCommonsCompress = { group = "org.apache.commons", name = "commons-compress", version.ref = "apacheCommonsCompress" }
robothyCnRepo = { group = "com.robothy", name = "cn-repo", version.ref = "robothyCnRepo" }
gradleLombok = { group = "io.franzbecker", name = "gradle-lombok", version.ref = "gradleLombok" }
jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }
duckdb = { group = "org.duckdb", name = "duckdb_jdbc", version.ref = "duckdb" }
icebergCore = { group = "org.apache.iceberg", name = "iceberg-core", version.ref = "iceberg" }
icebergAws = { group = "org.apache.iceberg", name = "iceberg-aws", version.ref = "iceberg" }
icebergData = { group = "org.apache.iceberg", name = "iceberg-data", version.ref = "iceberg" }
# iceberg-data registers the readers and writers of every format, ORC included, when it reads a table.
icebergOrc = { group = "org.apache.iceberg", name = "iceberg-orc", version.ref = "iceberg" }
icebergParquet = { group = "org.apache.iceberg", name = "iceberg-parquet", version.ref = "iceberg" }
# The writers of iceberg-parquet take the MessageType of parquet-column, which iceberg-parquet only has at runtime.
parquetColumn = { group = "org.apache.parquet", name = "parquet-column", version.ref = "parquet" }
# Delta Lake through delta-kernel-java: the Delta client without Spark. Its DefaultEngine is built on a pluggable
# FileIO, so LocalS3 is reached with the AWS SDK that is already here rather than through Hadoop's S3A and the AWS bundle.
deltaKernelApi = { group = "io.delta", name = "delta-kernel-api", version.ref = "delta" }
deltaKernelDefaults = { group = "io.delta", name = "delta-kernel-defaults", version.ref = "delta" }
# The Parquet writers and readers of Iceberg take a Hadoop Configuration: the shaded Hadoop client, without Hadoop's own dependencies.
hadoopClientApi = { group = "org.apache.hadoop", name = "hadoop-client-api", version.ref = "hadoop" }
hadoopClientRuntime = { group = "org.apache.hadoop", name = "hadoop-client-runtime", version.ref = "hadoop" }
springBootBom = { group = "org.springframework.boot", name = "spring-boot-dependencies", version.ref = "springBoot" }
springBootAutoconfigure = { group = "org.springframework.boot", name = "spring-boot-autoconfigure", version.ref = "springBoot" }
springBootHealth = { group = "org.springframework.boot", name = "spring-boot-health", version.ref = "springBoot" }
springBootConfigurationProcessor = { group = "org.springframework.boot", name = "spring-boot-configuration-processor", version.ref = "springBoot" }
springBootTest = { group = "org.springframework.boot", name = "spring-boot-test", version.ref = "springBoot" }
# Spring Boot 3: spring-boot-actuator holds the Health API that Boot 4 moved to spring-boot-health, and
# spring-boot-test-autoconfigure the @PropertyMapping that Boot 4 moved to spring-boot-test. The starter compiles
# against both layouts and picks one at runtime, so that one artifact serves Boot 3 and Boot 4.
springBoot3Bom = { group = "org.springframework.boot", name = "spring-boot-dependencies", version.ref = "springBoot3" }
springBoot3Actuator = { group = "org.springframework.boot", name = "spring-boot-actuator", version.ref = "springBoot3" }
springBoot3ActuatorAutoconfigure = { group = "org.springframework.boot", name = "spring-boot-actuator-autoconfigure", version.ref = "springBoot3" }
springBoot3TestAutoconfigure = { group = "org.springframework.boot", name = "spring-boot-test-autoconfigure", version.ref = "springBoot3" }
micrometerCore = { group = "io.micrometer", name = "micrometer-core", version.ref = "micrometer" }
awssdkNettyNioClient = { group = "software.amazon.awssdk", name = "netty-nio-client", version.ref = "awssdkS3" }
nettyBuffer = { group = "io.netty", name = "netty-buffer", version.ref = "netty" }
nettyCommon = { group = "io.netty", name = "netty-common", version.ref = "netty" }
nettyResolver = { group = "io.netty", name = "netty-resolver", version.ref = "netty" }
nettyCodec = { group = "io.netty", name = "netty-codec", version.ref = "netty" }
nettyCodecHttp2 = { group = "io.netty", name = "netty-codec-http2", version.ref = "netty" }
nettyTransportClassesEpoll = { group = "io.netty", name = "netty-transport-classes-epoll", version.ref = "netty" }

[bundles]
# The Netty modules of the netty-nio-client of the AWS SDK, at the Netty version of LocalS3. Maven doesn't apply the
# netty-bom to the consumers of a POM, and picks the version of a module that is the nearest to the consumer: a project
# that declares the AWS SDK before LocalS3 would get the Netty 4.1 modules of its netty-nio-client, e.g. netty-codec and
# netty-buffer, next to the Netty 4.2 of LocalS3, and LocalS3 fails to start with a NoClassDefFoundError. Declaring
# every Netty module of netty-nio-client makes Maven pick LocalS3's version. Only the modules that bring the AWS SDK
# declare them, so that an application that embeds local-s3-rest without the SDK doesn't get them.
nettyOfAwsSdk = ["nettyBuffer", "nettyCommon", "nettyResolver", "nettyTransport", "nettyHandler", "nettyCodec", "nettyCodecHttp", "nettyCodecHttp2", "nettyTransportClassesEpoll"]
