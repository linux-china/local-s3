import java.nio.file.Files

plugins {
    id 'maven-publish'
    id 'signing'
    id 'local-s3.central-portal'
}

java {
    withSourcesJar()
    withJavadocJar()
}

publishing {

    publications {
        maven(MavenPublication) {
            groupId = group
            artifactId = project.name
            from components.java

            pom {
                name = "LocalS3"
                description = 'An AmazonS3 service implementation.'
                url = 'https://github.com/Robothy/local-s3'

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        id = 'robothy'
                        name = "Fuxiang Luo"
                        email = "robothyluo@gmail.com"
                    }
                }
            }
        }
    }
}


tasks.register('delombok', JavaExec) {
    dependsOn compileJava
    ext.outputDir = project.layout.buildDirectory.dir("delombok").get()
    outputs.dir(outputDir)
    mainClass.set('lombok.launch.Main')
    classpath = configurations.annotationProcessor
    sourceSets.main.java.srcDirs.each {
        if (it.exists()) {
            inputs.dir(it)
        }
    }
    inputs.files(sourceSets.main.compileClasspath).withPropertyName('compileClasspath')
    doFirst {
        outputDir.asFile.mkdirs()
        def argList = ['delombok']
        sourceSets.main.java.srcDirs.each {
            if (it.exists()) {
                argList += [it.absolutePath]
            }
        }
        // Delombok resolves the types of the sources, which it reports as errors if they aren't on its classpath.
        argList += ['--classpath', sourceSets.main.compileClasspath.asPath]
        argList += ['-d', outputDir.asFile.absolutePath]
        args = argList
    }
}

javadoc {
    dependsOn delombok
    source = delombok.outputDir
    //failOnError = false
}

// Artifacts are signed for Maven Central, which requires signatures. A signing key is configured with the properties
// signing.secretKey, or signing.secretKeyRingFile for a file that holds it, and signing.password. Without a key, the
// signing tasks are skipped, so that publishToMavenLocal installs the modules on any machine; a task that uploads to
// Maven Central still requires the signatures, and fails without a key.
def signingKey = findProperty("signing.secretKeyRingFile") != null
        ? Files.readString(file(findProperty("signing.secretKeyRingFile")).toPath())
        : findProperty("signing.secretKey")

signing {
    if (signingKey != null) {
        useInMemoryPgpKeys(signingKey, findProperty("signing.password"))
    }
    required = {
        gradle.taskGraph.allTasks.any { task ->
            task.project == project && (task.name == 'zipMavenCentralPortalPublication'
                    || task.name == 'uploadMavenCentralPortal'
                    || task.name.contains('ToMavenCentral'))
        }
    }
}
