plugins {
    id 'java'
    id 'jacoco'
    //id 'com.robothy.cn-repo'
}

repositories {
    mavenCentral()


//    maven { url 'https://maven.aliyun.com/repository/google/' }
//    maven { url 'https://maven.aliyun.com/repository/public/' }
//    maven { url 'https://maven.aliyun.com/repository/spring/' }
//    maven { url 'https://maven.aliyun.com/repository/gradle-plugin/' }
//    maven { url 'https://maven.aliyun.com/repository/spring-plugin/' }

}

project.group = 'io.github.robothy'

dependencies {
    implementation(libs.slf4jApi)
    compileOnly(libs.lombok)
    annotationProcessor(libs.lombok)
    testCompileOnly(libs.lombok)
    testAnnotationProcessor(libs.lombok)
    testImplementation(libs.mockitoCore)
    testImplementation(libs.junit5JupiterEngine)
    testImplementation(libs.junit5)
    testRuntimeOnly(libs.junitPlatformLauncher)
}

test {
    useJUnitPlatform()
    // A certificate that LocalS3 generates is issued by the CA of mkcert where mkcert is installed; a CAROOT without
    // a CA keeps the certificates of the tests self-signed on every machine.
    environment 'CAROOT', layout.buildDirectory.dir('no-mkcert-ca').get().asFile.path
}

jacocoTestReport {
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.compileJava {
    options.encoding = "UTF-8"
}

tasks.compileTestJava {
    options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = 25
    targetCompatibility = 25
}
