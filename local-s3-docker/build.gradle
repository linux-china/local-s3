import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform


plugins {
    id 'local-s3.java-conventions'
}

dependencies {
    implementation(project(":local-s3-rest"))
    testImplementation(project(":local-s3-testcontainers"))
    runtimeOnly(libs.logbackClassic)
    testImplementation(libs.testContainers)
    testImplementation(libs.testContainersJunit)
    testImplementation(libs.awssdkS3)
    testImplementation(libs.awssdkS3vectors)
}

jar {
    manifest.attributes["Main-Class"] = "com.robothy.s3.docker.App"
    var runtimeClasses = configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    from runtimeClasses
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName.set("s3.jar")
}

def os = DefaultNativePlatform.getCurrentOperatingSystem()
def executor = os.isWindows() ? Arrays.asList("cmd", "/c") : Arrays.asList("sh", "-c")

// GraalVM Community for JDK 21. The tracing agent that collects reachability metadata and the
// native-image builder must be the same version, so both tasks below use this image.
def graalvmNativeImage = 'ghcr.io/graalvm/native-image-community:21.0.2-ol9'

tasks.register('collectReachabilityMetadata', JavaExec) {
    group('native-image')
    dependsOn('jar')

    outputs.cacheIf { true }

    inputs.file(project.layout.buildDirectory.file("libs/s3.jar"))
            .withPropertyName("jar")
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property("graalvm-native-image", graalvmNativeImage)

    outputs.dir(project.layout.buildDirectory.file("reachability-metadata"))
            .withPropertyName("reachability-metadata")

    mainClass.set('com.robothy.s3.docker.ReachabilityMetadataGenerator')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
    systemProperty("graalvm.native-image", graalvmNativeImage)

    doFirst {
        // Start from scratch, so that no metadata collected by another GraalVM version is left behind.
        project.delete(project.layout.buildDirectory.dir("reachability-metadata"))
        project.layout.buildDirectory.dir("reachability-metadata/META-INF/native-image").get().asFile.mkdirs()
    }
}

tasks.register('buildGraalVMNativeImage', Exec) {
    group('native-image')
    dependsOn('collectReachabilityMetadata')

    outputs.cacheIf { true }
    inputs.dir(project.layout.buildDirectory.dir("reachability-metadata"))
            .withPropertyName("reachability-metadata")
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(project.layout.buildDirectory.file("libs/s3.jar"))
            .withPropertyName("jar")
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property("graalvm-native-image", graalvmNativeImage)
    outputs.file(project.layout.buildDirectory.file("bin/s3"))
            .withPropertyName("s3-native-image")

    doFirst {
        var cmd = new ArrayList(executor)
        var buildCmd = """docker run --rm \
-v ${project.projectDir}:/project \
-v ${project.layout.buildDirectory.get().asFile}/bin:/app \
${graalvmNativeImage} \
-jar /project/build/libs/s3.jar \
--initialize-at-build-time=ch.qos.logback,org.slf4j \
--install-exit-handlers \
--class-path /project/build/reachability-metadata
"""
        cmd.add(buildCmd)
        commandLine(cmd)
    }
}

tasks.register('buildGraalVMNativeBasedDockerImage', Exec) {
    group("docker-image")
    dependsOn('buildGraalVMNativeImage')

    outputs.cacheIf { true }

    inputs.file(project.layout.buildDirectory.file("bin/s3"))
            .withPropertyName("s3-native-image")
            .withPathSensitivity(PathSensitivity.RELATIVE)

    doFirst {
        var cmd = new ArrayList(executor)
        cmd.add("docker build -t luofuxiang/local-s3:native-${project.version} -f GraalVMNativeImage.dockerfile .")
        commandLine(cmd)
    }
}

tasks.register('buildJava21BasedDockerImage', Exec) {
    group("docker-image")
    dependsOn('jar')

    doFirst {
        var cmd = new ArrayList(executor)
        cmd.add("docker build -t luofuxiang/local-s3:latest -t luofuxiang/local-s3:${project.version} .")
        commandLine(cmd)
    }
}


tasks.register('buildDockerImages') {
    group("docker-image")
    dependsOn ('buildGraalVMNativeBasedDockerImage', 'buildJava21BasedDockerImage')
    description = "Builds the docker images"
}

// The tests of this module run LocalS3 Docker images. They are tagged "docker-image" and run by the image
// test tasks below, which build the image first. The regular `test` task skips them, so that
// `./gradlew build` needs neither Docker nor the slow GraalVM native build.
tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'docker-image'
    }
    failOnNoDiscoveredTests = false
}

def registerImageTest(String taskName, String imageTag, String buildImageTask, String imageArtifact, String imageKind) {
    tasks.register(taskName, Test) {
        group = 'docker-image'
        description = "Builds and tests the ${imageKind} Docker image."
        dependsOn(buildImageTask)
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags 'docker-image'
        }
        systemProperty('local-s3.image.tag', imageTag)
        // The image is built from this artifact, so the tests run again when it changes.
        inputs.file(layout.buildDirectory.file(imageArtifact))
                .withPropertyName('image-artifact')
                .withPathSensitivity(PathSensitivity.RELATIVE)
    }
}

registerImageTest('dockerImageTest', 'latest', 'buildJava21BasedDockerImage', 'libs/s3.jar', 'JVM based')
registerImageTest('nativeImageTest', "native-${project.version}", 'buildGraalVMNativeBasedDockerImage', 'bin/s3',
        'GraalVM native image based')

tasks.register('pushJava21BasedDockerImage', Exec) {
    dependsOn 'dockerImageTest'
    group("docker-image")
    doFirst {
        var cmd = new ArrayList(executor)
        cmd.add("docker push luofuxiang/local-s3:${project.version}")
        commandLine(cmd)
    }
}

tasks.register('pushGraalVMNativeBasedDockerImage', Exec) {
    // Like before, pushing requires the image tests of the JVM based image; run nativeImageTest to test this one.
    dependsOn 'buildGraalVMNativeBasedDockerImage', 'dockerImageTest'
    group("docker-image")
    doFirst {
        var cmd = new ArrayList(executor)
        cmd.add("docker push luofuxiang/local-s3:native-${project.version}")
        commandLine(cmd)
    }
}

tasks.register('pushLatestImage', Exec) {
    dependsOn 'dockerImageTest'
    group("docker-image")
    doFirst {
        var cmd = new ArrayList(executor)
        cmd.add("docker push luofuxiang/local-s3:latest")
        commandLine(cmd)
    }
}

tasks.register('buildAndPushMultiPlatformDockerImage', Exec) {
    group("docker-image")
    // The release used to test the image in `check`; test it before pushing now that `test` doesn't.
    dependsOn('jar', 'dockerImageTest')
    description = "Builds and pushes a multi-platform (linux/amd64 + linux/arm64) Docker image using buildx."

    doFirst {
        var cmd = new ArrayList(executor)
        cmd.add("docker buildx build --platform linux/amd64,linux/arm64 --push" +
                " -t luofuxiang/local-s3:latest" +
                " -t luofuxiang/local-s3:${project.version}" +
                " .")
        commandLine(cmd)
    }
}


rootProject.tasks.release.dependsOn(buildAndPushMultiPlatformDockerImage, pushGraalVMNativeBasedDockerImage)
