name: Release
on:
  workflow_dispatch:
    inputs:
      gradleLogLevel:
        description: 'Gradle logging level.'
        required: false
        default: Info
        type: choice
        options:
          - Info
          - Warn
          - Debug
          - Stacktrace

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GITHUB_USERNAME: Robothy

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21 for Gradle
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: luofuxiang
          password: ${{secrets.DOCKER_HUB_TOKEN}}

      - name: Docker Version
        run: |
          docker --version      

      - name: Prepare parameters
        run: |
          git log --pretty=format:"%H - %an, %aI : %s" -5
          mkdir -p ~/.gradle
          echo "GITHUB_TOKEN=${{secrets.PACKAGES_TOKEN}}" > ~/.gradle/gradle.properties
          echo "GITHUB_USERNAME=Robothy" >> ~/.gradle/gradle.properties
          echo "signing.secretKey=${{ secrets.SING_SECRET_KEY }}" >> ~/.gradle/gradle.properties
          echo "signing.password=${{ secrets.SING_PASSWORD }}" >> ~/.gradle/gradle.properties
          echo "OSSRH_USERNAME=${{ secrets.OSSRH_USERNAME }}" >> ~/.gradle/gradle.properties
          echo "OSSRH_PASSWORD=${{ secrets.OSSRH_PASSWORD }}" >> ~/.gradle/gradle.properties
          echo "MAVEN_CENTRAL_PORTAL_USERNAME=${{ secrets.OSSRH_USERNAME }}" >> ~/.gradle/gradle.properties
          echo "MAVEN_CENTRAL_PORTAL_PASSWORD=${{ secrets.OSSRH_PASSWORD }}" >> ~/.gradle/gradle.properties
          chmod +x gradlew
          pwd
          ls -l

      # The release plugin isn't compatible with the configuration cache, which gradle.properties turns
      # on: one of its tasks holds a ByteArrayOutputStream, which can't be stored. Only the release
      # tasks need this opt-out; the build and PR workflows run with the cache.
      - name: Update release version
        run: |
          ./gradlew releaseVersion --no-configuration-cache

      - name: Release(Info)
        if: ${{inputs.gradleLogLevel == 'Info'}}
        run: |
          ./gradlew check release --info --no-configuration-cache

      - name: Release(Warn)
        if: ${{inputs.gradleLogLevel == 'Warn'}}
        run: |
          ./gradlew check release --warn --no-configuration-cache

      - name: Release(Debug)
        if: ${{inputs.gradleLogLevel == 'Debug'}}
        run: |
          ./gradlew check release --debug --no-configuration-cache

      - name: Release(Stacktrace)
        if: ${{inputs.gradleLogLevel == 'Stacktrace'}}
        run: |
          ./gradlew check release --stacktrace --no-configuration-cache