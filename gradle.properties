version=2.5-SNAPSHOT

# The modules of this build compile and test independently, so run the tasks of the ones that don't
# depend on each other at the same time.
org.gradle.parallel=true

# Reuse the configured task graph instead of configuring the build again on every invocation.
# `release` and `releaseVersion` are the exception: a task of the release plugin holds a
# ByteArrayOutputStream, which the configuration cache can't store, so the release workflow passes
# --no-configuration-cache. Everything else, including the Docker image tasks, works with it.
org.gradle.configuration-cache=true
