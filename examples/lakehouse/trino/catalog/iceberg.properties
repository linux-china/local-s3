connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://local-s3:29090/iceberg

# Trino reads and writes the files itself, with its own S3 client, configured here rather than vended.
fs.native-s3.enabled=true
s3.endpoint=http://local-s3:29090
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=admin
s3.aws-secret-key=admin
