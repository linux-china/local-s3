# LocalS3 with its Iceberg REST catalog, and Spark and Trino on top of it; see README.md.
name: local-s3-lakehouse

services:
  local-s3:
    # 2.5.0 isn't released yet: compose builds the image from local-s3-standalone/build/libs/s3.jar, which
    # `./gradlew :local-s3-standalone:jar` produces. Once it is released, the build section can go.
    image: linuxchina/local-s3:2.5.0-SNAPSHOT
    build: ../../local-s3-standalone
    environment:
      LOCAL_S3_ICEBERG_CATALOG: "true"
      LOCAL_S3_ICEBERG_WAREHOUSE: s3://warehouse/
      LOCAL_S3_ACCESS_KEY_ID: admin
      LOCAL_S3_SECRET_ACCESS_KEY: admin
    ports:
      # The loopback address alone: the catalog vends the credentials above to anyone who reaches the port.
      - "127.0.0.1:29090:29090"
    volumes:
      - local-s3-data:/data

  spark:
    image: apache/spark:3.5.6
    depends_on:
      local-s3:
        condition: service_healthy
    # Kept running, so that the Iceberg jars, downloaded by the first spark-sql, stay in /tmp/.ivy2 for the next.
    entrypoint: ["sleep", "infinity"]
    environment:
      AWS_REGION: us-east-1
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./sql:/opt/sql:ro
    ports:
      - "127.0.0.1:4040:4040"

  trino:
    image: trinodb/trino:476
    depends_on:
      local-s3:
        condition: service_healthy
    volumes:
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
      - ./sql:/opt/sql:ro
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  local-s3-data:
