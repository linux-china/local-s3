# The Iceberg runtime of Spark 3.5, and iceberg-aws-bundle for the S3FileIO that the catalog asks for.
spark.jars.packages                     org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.10.0,org.apache.iceberg:iceberg-aws-bundle:1.10.0
# The user of the image has no home directory to keep the Ivy cache in.
spark.jars.ivy                          /tmp/.ivy2
spark.sql.extensions                    org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# The URI is the whole configuration: the catalog vends the S3 endpoint (the host Spark addressed, local-s3),
# path-style access, the region and the credentials.
spark.sql.catalog.local                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.local.type            rest
spark.sql.catalog.local.uri             http://local-s3:29090/iceberg
spark.sql.defaultCatalog                local
